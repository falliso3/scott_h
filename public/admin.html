<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Submissions</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .card { max-width: 960px; }

    .back-link {
      display: inline-block;
      margin-bottom: 1.25rem;
      color: #4299e1;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }

    .auth-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .auth-row input { flex: 1; }

    .query-panel {
      display: none;
      background: #f7fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    .query-panel.visible { display: block; }

    .query-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .query-btn {
      background: #fff;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      padding: 0.45rem 0.9rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.15s;
    }
    .query-btn:hover { border-color: #4299e1; color: #2b6cb0; }
    .query-btn.active { background: #4299e1; border-color: #4299e1; color: #fff; }

    .search-row {
      display: flex;
      gap: 0.75rem;
    }
    .search-row input {
      flex: 1;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      font-size: 1rem;
      outline: none;
    }
    .search-row input:focus {
      border-color: #4299e1;
      box-shadow: 0 0 0 3px rgba(66,153,225,0.2);
    }

    #count { color: #718096; font-size: 0.875rem; margin-bottom: 0.75rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th {
      text-align: left;
      padding: 0.6rem 0.75rem;
      background: #edf2f7;
      color: #4a5568;
      font-weight: 600;
      border-bottom: 2px solid #cbd5e0;
    }
    td {
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
      color: #2d3748;
    }
    tr:hover td { background: #f7fafc; }

    .hobbies-list { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .hobby-tag {
      background: #ebf8ff;
      color: #2b6cb0;
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
    .bar-label { min-width: 200px; font-size: 0.9rem; color: #2d3748; text-align: right; }
    .bar-track { flex: 1; background: #e2e8f0; border-radius: 4px; height: 22px; overflow: hidden; }
    .bar-fill { height: 100%; background: #4299e1; border-radius: 4px; transition: width 0.4s; }
    .bar-count { min-width: 2rem; font-size: 0.875rem; color: #718096; font-weight: 600; }

    .empty { text-align: center; color: #a0aec0; padding: 2rem; }

    button[type="button"] {
      background: #4299e1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button[type="button"]:hover { background: #3182ce; }
    button[type="button"]:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="back-link">← Back to form</a>
    <h1>Admin View</h1>
    <p class="subtitle">Enter your admin key to access submissions.</p>

    <div class="auth-row">
      <input type="password" id="keyInput" placeholder="Admin key" />
      <button type="button" id="authBtn">Unlock</button>
    </div>

    <div class="query-panel" id="queryPanel">
      <div class="query-options">
        <button class="query-btn active" data-type="all">All Submissions</button>
        <button class="query-btn" data-type="by-hobby">By Hobby</button>
        <button class="query-btn" data-type="by-name">By Name</button>
        <button class="query-btn" data-type="by-phone">By Phone</button>
        <button class="query-btn" data-type="popular-hobbies">Most Popular Hobbies</button>
      </div>
      <div class="search-row">
        <input type="text" id="valueInput" placeholder="Search..." style="display:none" />
        <button type="button" id="runBtn">Run Query</button>
      </div>
    </div>

    <div id="count"></div>
    <div id="results"></div>
  </div>

  <script>
    const API_URL = 'https://scotth.vercel.app/api/admin';

    let adminKey = '';
    let currentType = 'all';

    const keyInput   = document.getElementById('keyInput');
    const authBtn    = document.getElementById('authBtn');
    const queryPanel = document.getElementById('queryPanel');
    const valueInput = document.getElementById('valueInput');
    const runBtn     = document.getElementById('runBtn');
    const countEl   = document.getElementById('count');
    const resultsEl = document.getElementById('results');

    // Auth
    authBtn.addEventListener('click', async () => {
      const key = keyInput.value.trim();
      if (!key) return;
      adminKey = key;
      await runQuery();
    });
    keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') authBtn.click(); });

    // Query type buttons
    document.querySelectorAll('.query-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.query-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentType = btn.dataset.type;

        const needsValue = ['by-hobby', 'by-name', 'by-phone'].includes(currentType);
        valueInput.style.display = needsValue ? 'block' : 'none';

        const placeholders = {
          'by-hobby': 'e.g. Cooking',
          'by-name': 'e.g. Jane',
          'by-phone': 'e.g. (555)',
        };
        if (needsValue) {
          valueInput.placeholder = placeholders[currentType];
          valueInput.value = '';
          valueInput.focus();
        }
      });
    });

    valueInput.addEventListener('keydown', e => { if (e.key === 'Enter') runQuery(); });
    runBtn.addEventListener('click', runQuery);

    async function runQuery() {
      if (!adminKey) return;

      runBtn.disabled = true;
      runBtn.textContent = 'Loading...';
      countEl.textContent = '';
      resultsEl.innerHTML = '';

      const params = new URLSearchParams({ type: currentType });
      if (valueInput.value.trim()) params.set('value', valueInput.value.trim());

      try {
        const res = await fetch(`${API_URL}?${params}`, {
          headers: { 'x-admin-key': adminKey },
        });

        if (res.status === 401) {
          alert('Incorrect admin key.');
          adminKey = '';
          queryPanel.classList.remove('visible');
          return;
        }

        if (!queryPanel.classList.contains('visible')) {
          queryPanel.classList.add('visible');
        }

        const data = await res.json();

        if (currentType === 'popular-hobbies') {
          renderChart(data);
        } else {
          renderTable(data);
        }
      } catch {
        resultsEl.innerHTML = '<p class="empty">Could not reach the server.</p>';
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = 'Run Query';
      }
    }

    function renderTable(records) {
      countEl.textContent = `${records.length} result${records.length !== 1 ? 's' : ''}`;

      if (records.length === 0) {
        resultsEl.innerHTML = '<p class="empty">No records found.</p>';
        return;
      }

      const rows = records.map(r => `
        <tr>
          <td>${esc(r.name)}</td>
          <td>${esc(r.phone)}</td>
          <td><div class="hobbies-list">${(r.hobbies || []).map(h => `<span class="hobby-tag">${esc(h)}</span>`).join('')}</div></td>
          <td>${r.submittedAt ? new Date(r.submittedAt).toLocaleDateString() : '—'}</td>
          <td>${r.updatedAt ? new Date(r.updatedAt).toLocaleDateString() : '—'}</td>
        </tr>`).join('');

      resultsEl.innerHTML = `
        <table>
          <thead><tr><th>Name</th><th>Phone</th><th>Hobbies</th><th>Submitted</th><th>Updated</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function renderChart(data) {
      countEl.textContent = `${data.length} unique hobb${data.length !== 1 ? 'ies' : 'y'}`;

      if (data.length === 0) {
        resultsEl.innerHTML = '<p class="empty">No data yet.</p>';
        return;
      }

      const max = data[0].count;
      const bars = data.map((d, i) => `
        <div class="bar-row">
          <div class="bar-label">${i + 1}. ${esc(d.hobby)}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${Math.round((d.count / max) * 100)}%"></div>
          </div>
          <div class="bar-count">${d.count}</div>
        </div>`).join('');

      resultsEl.innerHTML = `<div style="padding:0.5rem 0">${bars}</div>`;
    }

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
